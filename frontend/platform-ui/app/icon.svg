<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="sigmasecBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Cyan to Violet Cyber Gradient -->
    <linearGradient id="sigmasecPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glowing Shield Outer Stroke -->
    <linearGradient id="sigmasecBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Drop Shadow / Glow -->
    <filter id="sigmasecGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#06b6d4" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Cyber Security Shield Silhouette -->
  <path
    d="M 32 3.5 L 56 12.5 C 56 39 45.5 54.5 32 61 C 18.5 54.5 8 39 8 12.5 Z"
    fill="url(#sigmasecBg)"
    stroke="url(#sigmasecBorder)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Subtle Inner Ambient Pulse -->
  <circle cx="32" cy="32" r="14" fill="#06b6d4" fill-opacity="0.08" />

  <!-- Distinctive Sigma (Σ) Symbol -->
  <path
    d="M 21 19 L 43 19 L 28 32 L 43 45 L 21 45"
    stroke="url(#sigmasecPrimary)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#sigmasecGlow)"
  />

  <!-- Center Security Core Accent -->
  <circle cx="28" cy="32" r="2.5" fill="#f8fafc" />
  <circle cx="28" cy="32" r="5" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
</svg>
