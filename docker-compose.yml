# =====================================================
# Common Configuration
# =====================================================


x-defaults: &defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-backend-env: &backend-env
  DATABASE_URL: postgresql://admin:secret@postgres:5432/mydb
  REDIS_URL: redis://redis:6379/0
  MINIO_URL: http://minio:9000
  PYTHONWARNINGS: ignore

# =====================================================
# Services
# =====================================================

services:

  postgres:
    <<: *defaults
    image: postgres:16-alpine
    container_name: postgres

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d mydb" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - cybersigma

  redis:
    <<: *defaults
    image: redis:7-alpine
    container_name: redis

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - cybersigma

  minio:
    <<: *defaults
    image: minio/minio
    container_name: minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: [ "CMD-SHELL", "mc ready local || exit 0" ]
      interval: 15s
      timeout: 5s
      retries: 5

    networks:
      - cybersigma

  backend:
    <<: *defaults
    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    container_name: backend

    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - ./backend/.env

    environment:
      <<: *backend-env
      NUCLEI_TEMPLATES_PATH: /home/appuser/nuclei-templates

    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - nuclei_templates:/home/appuser/nuclei-templates

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started


    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - cybersigma

  worker:
    <<: *defaults
    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    container_name: celery-worker

    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - ./backend/.env

    environment:
      <<: *backend-env
      C_FORCE_ROOT: "true"
      NUCLEI_TEMPLATES_PATH: /home/appuser/nuclei-templates

    command: >
      celery -A app.celery_app.celery_app worker --loglevel=info --queues=scans --concurrency=2

    volumes:
      - ./backend:/app
      - nuclei_templates:/home/appuser/nuclei-templates

    depends_on:
      backend:
        condition: service_started


    healthcheck:
      test: [ "CMD", "celery", "-A", "app.celery_app.celery_app", "inspect", "ping" ]
      interval: 20s
      timeout: 10s
      retries: 3

    networks:
      - cybersigma

  flower:
    <<: *defaults
    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    container_name: flower

    env_file:
      - ./backend/.env

    environment:
      <<: *backend-env
      C_FORCE_ROOT: "true"

    command: >
      celery -A app.celery_app.celery_app flower --port=5555

    ports:
      - "5555:5555"

    depends_on:
      worker:
        condition: service_started

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:5555" ]
      interval: 15s
      timeout: 5s
      retries: 3

    networks:
      - cybersigma

  dvwa:
    <<: *defaults
    image: vulnerables/web-dvwa
    container_name: dvwa

    ports:
      - "8088:80"

    profiles:
      - pentest

    networks:
      - cybersigma

# =====================================================
# Volumes
# =====================================================

volumes:
  postgres_data:
  redis_data:
  minio_data:
  nuclei_templates:  # live Nuclei templates; updated without image rebuild

# =====================================================
# Network
# =====================================================

networks:
  cybersigma:
    driver: bridge

